name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  pr-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR title format
      uses: deepakputra/action-pr-title@master
      with:
        regex: '^(feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:.+$'
        allowed_prefixes: 'feat,fix,docs,style,refactor,perf,test,chore'
      continue-on-error: true

    - name: Check commit message format
      uses: compilerla/conventional-pre-commit@v2
      continue-on-error: true

    - name: Check PR description
      run: |
        PR_BODY="${{ github.event.pull_request.body }}"
        if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 10 ]; then
          echo "❌ PR description too short or missing"
          exit 1
        fi
      continue-on-error: true

    - name: Check for large files
      run: |
        git diff --name-only --diff-filter=A HEAD~1 | \
        while read file; do
          size=$(git cat-file -s "HEAD:$file" 2>/dev/null || echo 0)
          # 10MB limit
          if [ $size -gt 10485760 ]; then
            echo "❌ Large file detected: $file ($((size / 1024 / 1024))MB)"
            exit 1
          fi
        done
      continue-on-error: true

  pr-tests:
    runs-on: ubuntu-latest
    needs: pr-validation

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Comment PR with test results
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let comment = '## Test Results\n\n';

          if (context.job.status === 'success') {
            comment += '✅ All tests passed!\n';
          } else {
            comment += '❌ Some tests failed. Check the logs above.\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      continue-on-error: true

  pr-labels:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Auto-label PR based on files changed
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const { data: pullRequest } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });

          const labels = new Set();

          files.forEach(file => {
            if (file.filename.includes('test')) {
              labels.add('tests');
            }
            if (file.filename.includes('README') || file.filename.includes('docs')) {
              labels.add('documentation');
            }
            if (file.filename.includes('src/example/auth')) {
              labels.add('authentication');
            }
            if (file.filename.includes('src/example/mcp')) {
              labels.add('mcp');
            }
          });

          if (labels.size > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: Array.from(labels),
            });
          }
      continue-on-error: true
